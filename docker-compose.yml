networks:
  monitoring_network:
    driver: bridge

volumes:
  es_data:

services:
  # 1. Prometheus: Force Go GC + limit TSDB storage
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    mem_limit: 450m
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--config.expand-env'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=1GB'
      - '--storage.tsdb.wal-compression'
      - '--query.max-concurrency=4'
    environment:
      APP_HOST: ${APP_HOST}
      WINDOWS_HOST: ${WINDOWS_HOST}
      GOMEMLIMIT: 320MiB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring_network

  # 2. Grafana: Disable telemetry & enforce Go GC ceiling
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - PROMETHEUS_HOST=prometheus
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GOMEMLIMIT=180MiB
    depends_on:
      - prometheus
    volumes:
      - ./grafana-provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana-provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana-provisioning/dashboards:/var/lib/grafana/dashboards
    networks:
      - monitoring_network

  # 3. Elasticsearch: Lower Heap to 512MB + disable native ML
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.4
    container_name: elasticsearch
    restart: unless-stopped
    mem_limit: 1150m
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ingest.geoip.downloader.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - monitoring_network

  # 4. Kibana: Throttle Node.js V8 Heap + disable Fleet/Reporting
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.4
    container_name: kibana
    restart: unless-stopped
    mem_limit: 800m
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=512
      - TELEMETRY_ENABLED=false
      - XPACK_FLEET_ENABLED=false
      - XPACK_REPORTING_ENABLED=false
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - monitoring_network